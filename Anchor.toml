[programs.localnet]
kin = "7CGtKBZVMKgWJRg92SmRiQkeQe8hvTV3SWrHRfsdSMWe"
kin_faucet = "G5MhE85BTiTqLPinKZBg7jh4sNMyTc7WUvGcfMerWsig"

[programs.devnet]
kin = "7CGtKBZVMKgWJRg92SmRiQkeQe8hvTV3SWrHRfsdSMWe"
kin_faucet = "G5MhE85BTiTqLPinKZBg7jh4sNMyTc7WUvGcfMerWsig"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
# The ledger lives on an NTFS-backed WSL mount, where a cold RocksDB genesis load is slow.
# The default wait is too short there and the suite never gets to run; this margin is generous everywhere else.
startup_wait = 30000
